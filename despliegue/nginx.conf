map $http_upgrade $conexion_kindbox {
    default upgrade;
    '' close;
}
map $http_origin $origen_kindbox_invalido {
    default 1;
    '' 0;
    'https://1inf54-983-3c.inf.pucp.edu.pe' 0;
    'https://200.16.7.160' 0;
}
server {
    listen 80;
    server_name 1inf54-983-3c.inf.pucp.edu.pe 200.16.7.160;
    return 301 https://1inf54-983-3c.inf.pucp.edu.pe$request_uri;
}
server {
    listen 443 ssl;
    server_name 1inf54-983-3c.inf.pucp.edu.pe 200.16.7.160;
    ssl_certificate /etc/kindbox/certificado.pem;
    ssl_certificate_key /etc/kindbox/clave.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "KindBox - Equipo PaqRap";
    auth_basic_user_file /etc/kindbox/usuarios;
    root /opt/kindbox/actual/visualizador;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    if ($origen_kindbox_invalido) { return 403; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_kindbox;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
