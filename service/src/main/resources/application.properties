# Servicio REST y WebSocket que alimenta el componente visualizador de KindBox.
spring.application.name=kindbox-service
server.port=8080

# Directorio raiz de los datos de entrada: ventas/, bloqueos/, mantenimiento/ y flota.txt.
# Se generan con org.kindbox.experiments.GenerarDatos. El juego reducido esta en data/prueba.
kindbox.directorio-datos=data

# Valores por defecto de la pantalla de inicio y configuracion.
# Los cinco dias simulados deben recorrerse en entre 30 y 60 minutos reales.
kindbox.primer-dia-por-defecto=2026-09-01
kindbox.dias-por-defecto=5
kindbox.duracion-minutos-por-defecto=30
kindbox.salto-minutos-por-defecto=30
kindbox.minutos-entre-fotografias-por-defecto=5
kindbox.algoritmo-por-defecto=ALNS
kindbox.semilla-por-defecto=20262
kindbox.generar-averias-por-defecto=true
kindbox.averias-por-unidad-por-turno=0.02

# Limites del servicio.
kindbox.corridas-en-memoria=20
kindbox.capacidad-cola-difusion=32
kindbox.tamano-pagina-pedidos=25
kindbox.tamano-maximo-pagina-pedidos=500

# Carga masiva de averias por archivo. El limite de tamano lo impone el contenedor.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Las rutas desconocidas deben llegar al manejador de errores y no a la pagina por defecto.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.org.kindbox=INFO
